<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Sealed · Iprix's Spells</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Uncial+Antiqua&display=swap" rel="stylesheet">
  <style>
    :root { --night:#140b22; --dusk:#22123b; --violet:#4b2a85; --amethyst:#8a5bd8; --orchid:#c9a2ff; --moon:#f1e9ff; --candle:#e9c776; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 1.5rem;
      font-family: "Inter", system-ui, sans-serif; color: var(--moon); background-color: var(--night);
      background-image:
        radial-gradient(1.5px 1.5px at 12% 18%, #fff8 50%, transparent), radial-gradient(1px 1px at 34% 72%, #fff6 50%, transparent),
        radial-gradient(1.5px 1.5px at 61% 31%, #fff7 50%, transparent), radial-gradient(1px 1px at 83% 64%, #fff6 50%, transparent),
        radial-gradient(1px 1px at 92% 12%, #fff8 50%, transparent), radial-gradient(1px 1px at 47% 91%, #fff5 50%, transparent),
        radial-gradient(ellipse at 75% -10%, #4b2a8566, transparent 60%), radial-gradient(ellipse at 10% 110%, #3a1b6a55, transparent 55%);
      background-attachment: fixed;
    }
    main { width: min(24rem, 100%); text-align: center; }
    .seal { position: relative; width: 13rem; height: 13rem; margin: 0 auto 1.25rem; display: grid; place-items: center; }
    .seal svg { position: absolute; inset: 0; width: 100%; height: 100%; }
    .ring { animation: spin 40s linear infinite; }
    .ring text { font-size: 13px; fill: var(--orchid); opacity: .8; }
    .ring2 { animation: spin 26s linear infinite reverse; }
    .ring2 circle { fill: none; stroke: var(--amethyst); stroke-width: 1; stroke-dasharray: 2 7; opacity: .7; }
    .moon { font-size: 3.4rem; color: var(--candle); text-shadow: 0 0 24px #e9c776aa, 0 0 50px #8a5bd8; animation: pulse 4s ease-in-out infinite alternate; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes pulse { from { opacity: .75; transform: scale(.96); } to { opacity: 1; transform: scale(1.04); } }
    h1 { margin: 0 0 .3rem; font: 400 2rem/1.15 "Uncial Antiqua", serif; text-shadow: 0 0 26px #8a5bd8aa; }
    .sub { margin: 0 0 1.5rem; color: #d9cbf2; font-size: .95rem; }
    form { padding: 1.25rem; background: #22123bcc; border: 1px solid #8a5bd855; border-radius: .8rem; box-shadow: 0 14px 40px #0008, 0 0 40px #8a5bd822; backdrop-filter: blur(4px); }
    form.shake { animation: shake .45s; }
    @keyframes shake { 20%,60% { transform: translateX(-8px); } 40%,80% { transform: translateX(8px); } }
    .pw { position: relative; }
    input { width: 100%; padding: .75rem 3.2rem .75rem .9rem; font: inherit; letter-spacing: .08em; color: var(--moon); background: var(--night); border: 1px solid #8a5bd877; border-radius: .5rem; }
    input:focus-visible { outline: 2px solid var(--candle); outline-offset: 1px; }
    .eye { position: absolute; right: .35rem; top: 50%; transform: translateY(-50%); padding: .35rem .5rem; font-size: .8rem; color: var(--orchid); background: none; border: 0; cursor: pointer; }
    .go { width: 100%; margin-top: .9rem; padding: .75rem; font: inherit; font-weight: 600; color: #fff; cursor: pointer; background: linear-gradient(135deg, var(--amethyst), var(--violet)); border: 1px solid var(--orchid); border-radius: .5rem; transition: filter .15s, box-shadow .15s; }
    .go:hover { filter: brightness(1.12); box-shadow: 0 0 22px #8a5bd8aa; }
    .go:disabled { opacity: .55; cursor: wait; }
    .msg { min-height: 1.4rem; margin: .8rem 0 0; font-size: .9rem; color: #ff9fb3; }
    @media (prefers-reduced-motion: reduce) { .ring, .ring2, .moon, form.shake { animation: none; } }
  </style>
</head>
<body>
  <main>
    <div class="seal" aria-hidden="true">
      <svg class="ring" viewBox="0 0 200 200">
        <defs><path id="c" d="M100,100 m-82,0 a82,82 0 1,1 164,0 a82,82 0 1,1 -164,0"/></defs>
        <text><textPath href="#c" textLength="510" lengthAdjust="spacing">ᚠ ᚢ ᚦ ᚨ ᚱ ᚲ ᚷ ᚹ ᚺ ᚾ ᛁ ᛃ ᛇ ᛈ ᛉ ᛊ ᛏ ᛒ ᛖ ᛗ ᛚ ᛜ ᛞ ᛟ</textPath></text>
      </svg>
      <svg class="ring2" viewBox="0 0 200 200"><circle cx="100" cy="100" r="62"/></svg>
      <span class="moon">☾</span>
    </div>
    <h1>Sealed</h1>
    <p class="sub">Speak the word to enter the tower.</p>
    <form id="f">
      <div class="pw">
        <input type="password" id="pw" autocomplete="current-password" placeholder="Password" aria-label="Password" required autofocus>
        <button type="button" class="eye" id="eye" aria-label="Show password">show</button>
      </div>
      <button class="go" id="go" type="submit">Unseal</button>
      <p class="msg" id="msg" role="alert"></p>
    </form>
  </main>
  <script>
    const f = document.getElementById("f"), pw = document.getElementById("pw"), msg = document.getElementById("msg"), go = document.getElementById("go");
    document.getElementById("eye").addEventListener("click", (e) => {
      const show = pw.type === "password";
      pw.type = show ? "text" : "password";
      e.target.textContent = show ? "hide" : "show";
    });
    f.addEventListener("submit", async (e) => {
      e.preventDefault();
      go.disabled = true; msg.textContent = "";
      try {
        const r = await fetch("/login", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ password: pw.value }) });
        if (r.ok) return location.reload();
        const d = await r.json().catch(() => ({}));
        msg.textContent = d.error || "Something went wrong.";
        f.classList.remove("shake"); void f.offsetWidth; f.classList.add("shake");
        pw.select();
      } catch { msg.textContent = "Could not reach the server."; }
      go.disabled = false;
    });
  </script>
</body>
</html>
