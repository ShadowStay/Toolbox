<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Music</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Uncial+Antiqua&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/shared/site.css">
</head>
<body>
  <aside id="site-nav" aria-label="Main navigation"></aside>

  <main class="page wide">
    <h1 class="tool-title">Music</h1>
    <p class="tool-intro">Your library, streamed from the tower. Upload songs here, or download them to this device to play offline.</p>

    <div class="mbar">
      <input type="text" id="q" placeholder="Search songs, artists, albums, genres, playlists" autocomplete="off" spellcheck="false" aria-label="Search">
      <button class="btn small" id="upload" type="button">Upload</button>
      <input type="file" id="up" multiple hidden accept=".mp3,.flac,.m4a,.mp4,.ogg,.oga,.opus,.wav,audio/*">
      <button class="btn small" id="scan" type="button">Rescan</button>
    </div>
    <nav class="tabs" id="mnav" aria-label="Library">
      <a class="tab" href="#/home">Home</a>
      <a class="tab" href="#/songs">Songs</a>
      <a class="tab" href="#/albums">Albums</a>
      <a class="tab" href="#/artists">Artists</a>
      <a class="tab" href="#/genres">Genres</a>
      <a class="tab" href="#/playlists">Playlists</a>
      <a class="tab" href="#/liked">Liked</a>
      <a class="tab" href="#/history">History</a>
      <a class="tab" href="#/downloads">Downloads</a>
    </nav>

    <p class="status" id="status" role="status" aria-live="polite"></p>
    <div id="view"></div>
    <dialog id="pick"></dialog>
  </main>

  <script src="/shared/site.js"></script>
</body>
</html>
