<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iprix's Spells</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Uncial+Antiqua&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/shared/base.css">
</head>
<body>
  <aside id="site-nav" aria-label="Main navigation"></aside>

  <main class="page">
    <section class="hero">
      <div class="hero-text">
        <h1>Welcome to <span class="name">Iprix's Spells</span></h1>
        <p class="lede">An online toolbox. Open a tool from the sidebar or from the spellbook below.</p>
      </div>
      <figure class="portrait">
        <img src="/images/Iprix.png" alt="Iprix">
      </figure>
    </section>

    <section class="spellbook" aria-labelledby="spellbook-title">
      <h2 id="spellbook-title">Spellbook</h2>
      <ul id="tool-list"><li class="empty">Loading tools…</li></ul>
    </section>
  </main>

  <script src="/shared/navigation.js"></script>
</body>
</html>
