<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Video Editor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Uncial+Antiqua&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/shared/site.css">
</head>
<body>
  <aside id="site-nav" aria-label="Main navigation"></aside>

  <main class="page editor" id="editor">
    <header class="ed-top">
      <h1 class="tool-title ed-title">Video Editor</h1>
      <div class="ed-project">
        <label class="inline">Resolution
          <select id="res">
            <option value="1280x720" selected>1280 × 720 (HD)</option>
            <option value="1920x1080">1920 × 1080 (Full HD)</option>
            <option value="854x480">854 × 480</option>
            <option value="1080x1920">1080 × 1920 (vertical)</option>
            <option value="1080x1080">1080 × 1080 (square)</option>
          </select>
        </label>
        <label class="inline">Frame rate
          <select id="fps">
            <option value="24">24 fps</option>
            <option value="30" selected>30 fps</option>
            <option value="60">60 fps</option>
          </select>
        </label>
      </div>
      <div class="ed-actions">
        <button class="btn small" id="undo" type="button" title="Undo (Ctrl+Z)">Undo</button>
        <button class="btn small" id="redo" type="button" title="Redo (Ctrl+Shift+Z)">Redo</button>
        <button class="btn primary" id="export" type="button">Export…</button>
      </div>
    </header>

    <div class="ed-main">
      <!-- Media bin -->
      <section class="box bin" aria-label="Media">
        <h2>Media
          <label class="btn small import">Import
            <input type="file" id="picker" accept="video/*,audio/*,image/*" multiple>
          </label>
        </h2>
        <p class="hint bin-empty" id="bin-empty">Import video, audio or images (or drop files anywhere), then drag them onto the timeline or press +.</p>
        <ul class="media-list" id="media-list"></ul>
      </section>

      <!-- Preview -->
      <section class="box viewer" aria-label="Preview">
        <h2>Preview</h2>
        <div class="screen"><canvas id="screen" width="1280" height="720" aria-label="Preview"></canvas></div>
        <div class="transport">
          <button class="btn small" id="t-start" type="button" title="Go to start (Home)">|◀</button>
          <button class="btn small" id="t-back" type="button" title="Back one frame (←)">◀</button>
          <button class="btn small primary play" id="t-play" type="button" title="Play / pause (Space)">▶</button>
          <button class="btn small" id="t-fwd" type="button" title="Forward one frame (→)">▶</button>
          <button class="btn small" id="t-end" type="button" title="Go to end (End)">▶|</button>
          <span class="tc" id="tc">00:00:00:00</span>
          <span class="tc dim" id="tc-total">/ 00:00:00:00</span>
        </div>
      </section>

      <!-- Inspector -->
      <section class="box inspector" aria-label="Inspector">
        <h2>Inspector</h2>
        <div id="insp" class="insp-body"></div>
      </section>
    </div>

    <div class="ed-split" id="split" role="separator" aria-orientation="horizontal" title="Drag to resize the timeline"></div>

    <section class="timeline" aria-label="Timeline">
      <div class="tl-bar">
        <div class="grp">
          <button class="btn small" id="b-split" type="button" title="Split at the playhead (S)">✂ Split</button>
          <button class="btn small" id="b-dup" type="button" title="Duplicate (Ctrl+D)">Duplicate</button>
          <button class="btn small" id="b-delete" type="button" title="Delete (Delete)">Delete</button>
          <button class="btn small" id="b-ripple" type="button" title="Delete and close the gap (Shift+Delete)">Ripple delete</button>
        </div>
        <div class="grp">
          <button class="btn small" id="b-addv" type="button">+ Video track</button>
          <button class="btn small" id="b-adda" type="button">+ Audio track</button>
        </div>
        <label class="check"><input type="checkbox" id="snap" checked> Snap</label>
        <div class="grp zoom">
          <button class="btn small" id="z-out" type="button" title="Zoom out (−)">−</button>
          <span id="z-label" class="zl"></span>
          <button class="btn small" id="z-in" type="button" title="Zoom in (+)">+</button>
          <button class="btn small" id="z-fit" type="button">Fit</button>
        </div>
      </div>
      <div class="tl-scroll" id="tl-scroll">
        <div class="tl-content" id="tl-content">
          <div class="ruler-row">
            <div class="corner">Timeline</div>
            <div class="ruler-lane" id="ruler" title="Click or drag to move the playhead"></div>
          </div>
          <div id="track-list"></div>
          <div class="playhead" id="playhead"></div>
        </div>
      </div>
    </section>

    <footer class="ed-foot">
      <p class="status" id="status" role="status" aria-live="polite"></p>
      <span class="hint where"></span>
    </footer>

    <dialog id="exp" aria-labelledby="exp-title">
      <h2 id="exp-title">Export</h2>
      <div class="fields">
        <label class="field">Format <select id="ex-fmt"></select></label>
        <label class="field">Quality
          <select id="ex-q">
            <option value="high">High</option>
            <option value="medium" selected>Medium</option>
            <option value="low">Low (smaller file)</option>
          </select>
        </label>
        <label class="field">File name <input type="text" id="ex-name" value="video" autocomplete="off" spellcheck="false"></label>
      </div>
      <p class="hint" id="ex-note"></p>
      <progress id="ex-bar" max="100" value="0" hidden></progress>
      <p class="status" id="ex-status" role="status" aria-live="polite"></p>
      <div class="actions">
        <button class="btn primary" id="ex-go" type="button">Export</button>
        <button class="btn" id="ex-cancel" type="button">Close</button>
        <button class="btn" id="ex-switch" type="button" hidden>Switch to server processing</button>
      </div>
    </dialog>
  </main>

  <script src="/shared/site.js"></script>
</body>
</html>
